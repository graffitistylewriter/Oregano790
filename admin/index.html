<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Oregano 790 — Admin Workspace</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f5f2e8;background:#10110f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#10110f,#181a16);color:#f5f2e8}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{font-size:20px;font-weight:700;letter-spacing:.14em}.muted{color:#aaa99f}.card{background:#191b17;border:1px solid #30332c;border-radius:16px;padding:22px;box-shadow:0 16px 40px #0005}.login{max-width:460px;margin:10vh auto}.field{display:grid;gap:8px;margin:16px 0}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #3a3d35;background:#0f100e;color:#fff}.btn{border:0;border-radius:10px;padding:12px 16px;background:#c7a86b;color:#171711;font-weight:700;cursor:pointer}.btn.secondary{background:#2b2e27;color:#eee}.danger{color:#e58d8d}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{font-size:30px;font-weight:700;margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.status{margin-top:12px;min-height:22px}.list{margin-top:24px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px;border:1px solid #30332c;border-radius:12px;background:#141612}.row strong{display:block}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#292d25;color:#c9c6b8}@media(max-width:760px){.shell{padding:16px}.topbar{align-items:flex-start}.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <section id="login" class="card login">
      <div class="brand">OREGANO 790</div>
      <p class="muted">Private business-owner workspace</p>
      <form id="login-form">
        <label class="field">Admin access token<input id="token" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Enter workspace</button>
      </form>
      <div id="login-status" class="status" role="status"></div>
    </section>

    <section id="workspace" class="hidden">
      <header class="topbar">
        <div><div class="brand">OREGANO 790</div><div class="muted">Admin Workspace</div></div>
        <button id="logout" class="btn secondary">Lock workspace</button>
      </header>
      <div class="grid">
        <article class="card"><div class="muted">Catalogue products</div><div id="product-count" class="stat">—</div></article>
        <article class="card"><div class="muted">Catalogue status</div><div class="stat">LIVE</div></article>
        <article class="card"><div class="muted">Workspace</div><div class="stat">READY</div></article>
      </div>
      <article class="card" style="margin-top:16px">
        <h2>Catalogue management</h2>
        <p class="muted">This first workspace milestone connects the private owner workspace to the persistent catalogue API. Product editing comes next.</p>
        <div class="actions"><button id="refresh" class="btn">Refresh catalogue</button></div>
        <div id="workspace-status" class="status"></div>
        <div id="products" class="list"></div>
      </article>
    </section>
  </main>
  <script src="./workspace.js" defer></script>
</body>
</html>
